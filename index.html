<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 운세 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f5f0; color: #303030; font-family: Arial, 'Malgun Gothic', sans-serif; }
    main { width: min(92%, 450px); margin: 90px auto; padding: 36px 28px; background: white; border: 1px solid #dedbd2; border-radius: 12px; text-align: center; }
    h1 { font-size: 27px; margin: 0 0 12px; }
    .intro { font-size: 14px; color: #777; line-height: 1.7; margin-bottom: 30px; }
    label { display: block; text-align: left; font-size: 14px; margin-bottom: 9px; }
    input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #bdbdbd; border-radius: 5px; font-size: 15px; }
    button { width: 100%; height: 44px; margin-top: 14px; background: #557a61; color: white; border: 0; border-radius: 5px; font-size: 15px; cursor: pointer; }
    button:hover { background: #42654c; }
    #result { display: none; margin-top: 28px; padding: 24px 16px; background: #f4f7f2; border: 1px solid #dbe5d8; border-radius: 8px; }
    #result h2 { font-size: 19px; margin: 0 0 14px; }
    #fortuneText { line-height: 1.8; font-size: 16px; margin: 0 0 16px; }
    #lucky { font-size: 13px; color: #5c675e; margin: 0; }
    footer { font-size: 12px; color: #999; margin-top: 24px; }
    @media(max-width:480px){main{margin:45px auto;padding:28px 20px;}}
  </style>
</head>
<body>
  <main>
    <h1>오늘의 운세 뽑기</h1>
    <p class="intro">이름을 입력하고 오늘의 운세를 확인해 보세요.<br>결과는 재미로만 봐주세요!</p>
    <form id="fortuneForm">
      <label for="nameInput">이름</label>
      <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="20" required>
      <button type="submit">운세 확인하기</button>
    </form>
    <section id="result" aria-live="polite">
      <h2 id="resultTitle"></h2>
      <p id="fortuneText"></p>
      <p id="lucky"></p>
    </section>
    <footer>작은 웹 코딩 과제 · 오늘의 운세</footer>
  </main>
  <script>
    const fortunes = [
      '오늘은 예상하지 못한 좋은 소식이 찾아올지도 몰라요.',
      '미뤄 두었던 일을 시작하기 좋은 날이에요.',
      '맛있는 간식을 먹으면 기분이 좋아질 거예요.',
      '친구에게 먼저 연락해 보면 즐거운 일이 생길 수 있어요.',
      '작은 실수가 있어도 너무 걱정하지 마세요.',
      '오늘은 평소보다 조금 더 용기를 내보세요.',
      '기다리던 일이 천천히 풀리기 시작할 거예요.',
      '오늘의 행운은 가까운 곳에 숨어 있어요.'
    ];
    const colors = ['파란색', '노란색', '초록색', '분홍색', '보라색', '하얀색'];
    const form = document.getElementById('fortuneForm');
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const name = document.getElementById('nameInput').value.trim();
      if (!name) { alert('이름을 입력해 주세요.'); return; }
      const message = fortunes[Math.floor(Math.random() * fortunes.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const number = Math.floor(Math.random() * 9) + 1;
      document.getElementById('resultTitle').textContent = name + '님의 오늘의 운세';
      document.getElementById('fortuneText').textContent = message;
      document.getElementById('lucky').textContent = '행운의 색깔: ' + color + '  |  행운의 숫자: ' + number;
      document.getElementById('result').style.display = 'block';
    });
  </script>
</body>
</html>
